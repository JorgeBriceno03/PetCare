<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care -Acceso-</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pantalla-centrada">
    <div class="contenedor-login">
        <div class="cabecera">
            <h1>Pet Care 🐾</h1>
            <p>Tú mascota y su salud SIEMPRE CONTIGO</p>
        </div>
        <form action="#" method="POST">
            <div class=" grupo-input">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="tuemail@.com" required>
            </div>
            <div class="grupo-input">
                <label>Contraseña</label>
                <input type="password" placeholder="·······" required>
            </div>
            <button type="submit" class="btn-principal">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="registro.html" style="color: #0d9488; text-decoration: none;">Registrarse</a>
            </p>
    </div>
    
</body>
</html>
